<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local Notes App (Full CRUD)</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    li { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h2>My Notes (Full CRUD)</h2>
  
  <input type="text" id="noteInput" placeholder="Type a note..." style="padding: 8px;" />
  <button onclick="addNote()" style="padding: 8px;">Add Note</button>

  <ul id="notesList" style="margin-top: 20px; padding-left: 0; list-style: none;"></ul>

  <script>
    const API_URL = 'http://localhost:3000/api/notes';

    // READ
    async function loadNotes() {
      const res = await fetch(API_URL);
      const notes = await res.json();
      const list = document.getElementById('notesList');
      list.innerHTML = '';

      notes.forEach(note => {
        const li = document.createElement('li');
        
        const textSpan = document.createElement('span');
        textSpan.textContent = note.title;

        // Edit Button
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.onclick = () => editNote(note.id, note.title);

        // Delete Button
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.onclick = () => deleteNote(note.id);

        li.appendChild(textSpan);
        li.appendChild(editBtn);
        li.appendChild(deleteBtn);
        list.appendChild(li);
      });
    }

    // CREATE
    async function addNote() {
      const input = document.getElementById('noteInput');
      if (!input.value) return;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });

      input.value = '';
      loadNotes();
    }

    // UPDATE
    async function editNote(id, currentTitle) {
      const newTitle = prompt('Edit note:', currentTitle);
      if (!newTitle || newTitle === currentTitle) return;

      await fetch(`${API_URL}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: newTitle })
      });

      loadNotes();
    }

    // DELETE
    async function deleteNote(id) {
      await fetch(`${API_URL}/${id}`, {
        method: 'DELETE'
      });

      loadNotes();
    }

    loadNotes();
  </script>
</body>
</html>
